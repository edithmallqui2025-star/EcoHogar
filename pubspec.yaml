name: eco_hogar
description: "Aplicación móvil para incentivar el reciclaje en hogares de bajos recursos mediante un sistema de registro y recompensas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.5.0

  # UI
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.7
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0

  # QR Scanner
  qr_code_scanner: ^1.0.1
  mobile_scanner: ^3.5.0

  # Charts
  fl_chart: ^0.65.0

  # PDF
  pdf: ^3.10.0
  printing: ^5.11.0

  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # Image Picker
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0

  # Utilities
  intl: ^0.19.0
  get: ^4.6.6
  provider: ^6.1.0
  uuid: ^4.0.0
  dio: ^5.3.0

  # Animations
  lottie: ^2.7.0

  # Permission Handler
  permission_handler: ^11.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
